<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  {{data.message}}
  @if(data.dontShowAgain){
  <div class="dont-show-again">
    <mat-checkbox [(ngModel)]="dontShowAgain" i18n>Don't show this again</mat-checkbox>
  </div>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-stroked-button [mat-dialog-close]="cancelValue()" i18n>Cancel</button>
  @if(data.noText){
  <button mat-stroked-button [mat-dialog-close]="false">{{data.noText}}</button>
  }
  <button mat-stroked-button [mat-dialog-close]="yesValue()" [class]="data.yesClass??'warn'">
    @if(data.yesText){
    <span>{{data.yesText}}</span>
    }@else {
    <span i18n>Yes</span>
    }
  </button>
</mat-dialog-actions>
