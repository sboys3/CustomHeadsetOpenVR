<app-headset-settings [config]="headsetConfig" [driverName]="headsetConfig.driverName" [settingField]="headsetConfig.settingField" [headsetType]="HeadsetType.CrystalSuperUltrawide" (navigateToGeneralTab)="navigateToGeneralTab.emit()">
  <div headset-settings-content>
    <div class="distortion-warning">
      <mat-icon>warning</mat-icon>
      <span i18n>The distortion profiles are somewhat wrong for the Crystal Super Ultrawide.</span>
    </div>

    <app-pimax-launcher></app-pimax-launcher>
  </div>
  <div headset-settings-end>
    <app-pimax-slam-settings [settingField]="'crystalSuperUltrawide'"></app-pimax-slam-settings>
  </div>
</app-headset-settings>
